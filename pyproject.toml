[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-gateway"
version = "1.0.0"
description = "Local Claude Code Gateway — expose Claude Code over a localhost HTTP API (REST + SSE + WebSocket) for SAMURAI and other apps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "armaan" }]
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gateway = "claude_gateway.cli.main:main"

[tool.setuptools.packages.find]
include = ["claude_gateway*"]

[tool.setuptools.package-data]
claude_gateway = ["dashboard/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
